<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo List</title>
</head>

<body>
    <div id="container">
        <div id="sideNav">
            <div class="info">
                <div class="pfp"></div>
                <div class="name"></div>
                <div class="logout"></div>
            </div>
            <div id="search"></div>
            <div id="projectStore">
                <div id="defaultProject" class="project"></div>
            </div>
            <div class="addProject">
                <button id="addProjectForm">Add Project</button>
            </div>
        </div>
        <div id="content"></div>
        <form action="" id="project" style="display: none;">
            <input type="text" id="projectTitle" placeholder="Project Title">
            <input type="submit" id="projectForm">
            <button type="button" id="cancelProject">cancel</button>
        </form>
        <div class="addTodo">
            <button id="addTodoForm" style="display: none;">Add Todo</button>
        </div>
    </div>
    <form action="" id="todo" style="display: none;">
        <input type="text" id="todoTitle" placeholder="Todo Title">
        <input type="text" id="desc" placeholder="Description">
        <input type="time" id="dueDate">
        <input type="checkbox" id="status">
        <input type="number" id="priority">
        <input type="submit" value="add" id="todoInfo">
        <button type="button" id="cancelTodo">cancel</button>
    </form>
    
</body>
</html>
