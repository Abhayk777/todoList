<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo List</title>
</head>
<body>
    <div id="container">
        <div id="sideNav">
            <div class="info">
                <div class="pfp"></div>
                <div class="name"></div>
                <div class="logout"></div>
            </div>
            <div class="search"></div>
            <div class="projectStore"></div>
            <div class="addNew"></div>
        </div>
        <div id="content"></div>
    </div>
    <form action="" class="todo">
        <input type="text" class="project" placeholder="project">
        <input type="text" class="title" placeholder="title">
        <input type="text" class="desc" placeholder="description">
        <input type="time" class="time" placeholder="time">
        <input type="submit" value="add">
        <button type="button" id="cancel">cancel</button>
    </form>
</body>
</html>
